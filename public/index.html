<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />

    <meta name="title" content="Inblue Kiosk - Phỏng Vấn AI Tại Kiosk" />

    <!-- Open Graph / Facebook / Zalo / Telegram / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://inblue-mobile.vercel.app/" />
    <meta property="og:title" content="Inblue Kiosk - Phỏng Vấn AI Tại Kiosk" />
    <meta property="og:description" content="Hệ thống phỏng vấn AI tại Kiosk thuộc nền tảng Inblue Platform - FPT University" />
    <meta property="og:image" content="https://inblue-mobile.vercel.app/banner.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://inblue-mobile.vercel.app/" />
    <meta property="twitter:title" content="Inblue Kiosk - Phỏng Vấn AI Tại Kiosk" />
    <meta property="twitter:description" content="Hệ thống phỏng vấn AI tại Kiosk thuộc nền tảng Inblue Platform - FPT University" />
    <meta property="twitter:image" content="https://inblue-mobile.vercel.app/banner.jpg" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
      }

      body {
        background: #070b16;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
        inset: 0;
      }

      #root {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 163, 255, 0.62) rgba(8, 18, 38, 0.28);
      }

      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      *::-webkit-scrollbar-track {
        background: rgba(8, 18, 38, 0.28);
        border-radius: 999px;
      }

      *::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, rgba(152, 203, 255, 0.9), rgba(0, 163, 255, 0.54));
        border: 2px solid rgba(5, 10, 26, 0.68);
        border-radius: 999px;
        box-shadow: 0 0 12px rgba(0, 163, 255, 0.34);
      }

      *::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, rgba(191, 219, 254, 0.96), rgba(0, 163, 255, 0.72));
      }

      #transcript-scroll {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      #transcript-scroll::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }

      #live-transcript-hud,
      #live-transcript-hud * {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }

      #live-transcript-hud::-webkit-scrollbar,
      #live-transcript-hud *::-webkit-scrollbar {
        width: 0 !important;
        height: 0 !important;
        display: none !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
