<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b16" />
    <title>Inblue Kiosk</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
      }

      body {
        background: #070b16;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
        inset: 0;
      }

      #root {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 163, 255, 0.62) rgba(8, 18, 38, 0.28);
      }

      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      *::-webkit-scrollbar-track {
        background: rgba(8, 18, 38, 0.28);
        border-radius: 999px;
      }

      *::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, rgba(152, 203, 255, 0.9), rgba(0, 163, 255, 0.54));
        border: 2px solid rgba(5, 10, 26, 0.68);
        border-radius: 999px;
        box-shadow: 0 0 12px rgba(0, 163, 255, 0.34);
      }

      *::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, rgba(191, 219, 254, 0.96), rgba(0, 163, 255, 0.72));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
